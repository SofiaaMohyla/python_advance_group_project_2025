{% extends "base.html" %}
{% block content %}
<h1>Видалити проект?</h1>
<p>Ви дійсно хочете видалити "{{ object.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Видалити</button>
    <a href="{% url 'project-detail' object.pk %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
