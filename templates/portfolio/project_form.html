{% extends "base.html" %}
{% block content %}
<h1>{% if form.instance.pk %}Редагувати проект{% else %}Новий проект{% endif %}</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Зберегти</button>
</form>

<a href="{% url 'project-list' %}" class="btn btn-secondary">Назад</a>
{% endblock %}
