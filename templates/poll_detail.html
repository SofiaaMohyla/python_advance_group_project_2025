{% extends 'base.html' %}
{% block content %}
<h1>{{ poll.title }}</h1>
<h2>Питання {{ question_number }}: {{ question.text }}</h2>

<form method="post">
    {% csrf_token %}
    {% for choice in question.choices.all %}
        <label>
            <input type="radio" name="choice" value="{{ choice.id }}">
            {{ choice.text }}
        </label><br>
    {% endfor %}
    <button type="submit">Наступне питання</button>
</form>

{% endblock content %}
