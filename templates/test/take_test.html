{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Тестування</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <h2>{{ test.title }}</h2>
      <div>
        <p>{{ question.text }}</p>
        {% for choice in question.choices.all %}
          <label>
            <input type="radio" name="question_{{ question.id }}" value="{{ choice.id }}">
            {{ choice.text }}
          </label><br>
        {% endfor %}
      </div>
    <button type="submit" class="btn btn-primary">Надіслати</button>
  </form>
{% endblock %}
