{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Створення тесту</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Зберегти</button>
    <button type="button" class="btn btn-secondary" onclick="window.location.href='{% url 'test_list' %}'">Скасувати</button>
</form>
{% endblock %}
