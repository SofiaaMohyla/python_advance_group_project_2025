{% extends 'base.html' %}

{% block title %}Forum{% endblock %}

{% block content %}
<h2 class="text-center">Forum</h2>
<div class="list-group">
    {% for topic in topics %}
        <a href="{% url 'topic-detail' topic.pk %}" class="list-group-item list-group-item-action">
            <h5 class="mb-1">{{topic.title}}</h5>
            <small class="'mb-0">{{topic.description}}</small>

        </a>
        
    {% endfor %}
</div>

{% endblock %}
