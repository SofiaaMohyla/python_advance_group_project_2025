{% extends 'base.html' %}
{% block content %}
<div class="delete-container">
    <h2>Видалити подію: "{{ event.title }}"?</h2>
    <p class="warning-text">Це рішення є <strong>незворотним</strong>. Будь ласка, підтвердіть видалення.</p>

    <form action="{% url 'event_delete' event.id %}" method="post" onsubmit="return confirmDelete();">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-delete">Видалити</button>
        <a href="{% url 'calendar_detail' object.calendar.id %}" class="btn btn-secondary">Скасувати</a>
    </form>
</div>

<script>
    function confirmDelete() {
        return confirm('Ви впевнені, що хочете видалити цю подію?');
    }
</script>
{% endblock %}
