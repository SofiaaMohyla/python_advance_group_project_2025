{% extends "base.html" %}

{% block title %}Редагування оцінки{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Редагування оцінки</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Зберегти</button>
        <a href="{% url 'grade_list' %}" class="btn btn-secondary">Скасувати</a>
    </form>
</div>
{% endblock %}
