{% extends "base.html" %}

{% block title %}Видалити оцінку{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Видалити оцінку</h2>
    <p>Ви впевнені, що хочете видалити оцінку {{ object.value }} за урок {{ object.lesson.title }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Так, видалити</button>
        <a href="{% url 'grade_list' %}" class="btn btn-secondary">Скасувати</a>
    </form>
</div>
{% endblock %}
